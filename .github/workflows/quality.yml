# Checks the site/ folder that GitHub Pages publishes.
# The site is a single self-contained file (site/index.html);
# there is no build step.
name: Quality gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the published site
        run: |
          set -e
          test -s site/index.html
          test -s site/README.md
          grep -Fq 'PropFirmMath — Compare Prop Firms by the Math' site/index.html
          grep -Fq 'var FIRMS' site/index.html
          grep -Fq '#/firms' site/index.html
          grep -Fq '#/quiz' site/index.html
          grep -Fq 'Compare prop firms by' site/index.html
