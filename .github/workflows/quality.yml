name: Quality gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Calculation regressions
        run: |
          set -e
          test -d tests
          find tests -name '*.cjs' -print0 | xargs -0 -r -n1 node
      - name: Build static site
        env:
          SITE_URL: https://propfirmmath-xi.vercel.app
          BASE_PATH: /
        run: |
          python3 build.py
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt
      - name: Validate generated canonical URLs and sitemap
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          from urllib.parse import urlparse
          root = pathlib.Path("dist")
          urls = ET.parse(root / "sitemap.xml").findall(".//{*}loc")
          assert urls, "Empty sitemap"
          for entry in urls:
              path = urlparse(entry.text).path.lstrip("/")
              target = root / path
              assert target.is_file() or (target / "index.html").is_file(), entry.text
          PY
