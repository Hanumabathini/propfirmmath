# Builds the site and publishes it to GitHub Pages on every push to main.
# Free on public repositories. Set the repository variable SITE_URL (and
# BASE_PATH if the site lives at username.github.io/repo-name).
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          TOPSTEP_URL: ${{ vars.TOPSTEP_URL }}
          TRADEIFY_URL: ${{ vars.TRADEIFY_URL }}
          MFFU_URL: ${{ vars.MFFU_URL }}
          GSC_TOKEN: ${{ vars.GSC_TOKEN }}
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
        run: python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
